<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>页藏 · 本地网页档案</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <div class="brand"><span class="brand-mark">页藏</span><span class="brand-note">LOCAL WEB ARCHIVE / 本地网页档案</span></div>
      <div class="archive-status" id="archiveStatus">正在读取档案…</div>
    </header>
    <main>
      <section class="search-stage" aria-labelledby="pageTitle">
        <p class="eyebrow">找回你曾经认为“以后可能有用”的那一页</p>
        <h1 id="pageTitle">不是收藏夹。<br><span>是网页的本地记忆。</span></h1>
        <form class="search-box" id="searchForm">
          <label class="sr-only" for="searchInput">搜索标题或正文</label>
          <input id="searchInput" type="search" placeholder="输入技术名、问题描述或正文片段" autocomplete="off">
          <button type="submit">检索档案 <span>↵</span></button>
        </form>
        <div class="quick-searches" aria-label="搜索示例">
          <span>试试：</span><button data-query="离线安装">离线安装</button><button data-query="银行项目">银行项目</button><button data-query="Nacos">Nacos</button><button data-query="领域驱动设计">领域驱动设计</button>
        </div>
      </section>
      <section class="workspace" aria-label="网页档案工作区">
        <aside class="filters">
          <div class="filter-heading"><span>筛选柜</span><button id="clearFilters">清空</button></div>
          <button class="review-filter" id="reviewFilter"><span>待确认建议</span><strong id="reviewCount">0</strong></button>
          <div class="filter-group"><h2>阅读状态</h2><div id="stateFilters" class="filter-list"></div></div>
          <div class="filter-group"><h2>主分类</h2><div id="categoryFilters" class="filter-list"></div></div>
          <div class="filter-group"><h2>档案类型</h2><div id="typeFilters" class="filter-list"></div></div>
        </aside>
        <section class="results-panel">
          <div class="results-head"><div><span id="resultCount">—</span><small>份匹配档案</small></div><p id="resultContext">按保存时间浏览全部内容</p></div>
          <div id="results" class="results" aria-live="polite"></div>
          <nav id="pagination" class="pagination" aria-label="分页"></nav>
        </section>
      </section>
    </main>
  </div>
  <dialog id="assetDialog"><form method="dialog" class="dialog-close"><button aria-label="关闭">×</button></form><div id="assetDetail"></div></dialog>
  <div id="toast" class="toast" role="status"></div>
  <script src="/app.js" defer></script>
</body>
</html>
